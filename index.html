<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Potato Tycoon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--m:rgba(255,255,255,.62);--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.17)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"SF Pro Rounded",Roboto,system-ui,sans-serif;color:#fff;background:#120d2b}
body{background:radial-gradient(120% 70% at 15% 0%,#5a2fa8 0%,transparent 55%),radial-gradient(90% 60% at 100% 100%,#0d8a7a 0%,transparent 55%),linear-gradient(160deg,#1b1440,#0b1230);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18)}
header{display:flex;gap:10px;padding:12px 14px 6px}
.pill{border-radius:18px;padding:9px 14px;flex:1}
.pill b{font-size:20px;display:block;letter-spacing:.2px}
.pill small{color:var(--m);font-size:12px}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;padding:8px 14px 14px;overflow-y:auto;display:none}
.view.on{display:flex;flex-direction:column}
#slots{flex:1;display:grid;gap:12px;min-height:0}
.slot{position:relative;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;overflow:hidden;transition:transform .08s}
.slot:active{transform:scale(.97)}
.pot{font-size:clamp(64px,18vh,120px);line-height:1;transition:transform .08s;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.slot:active .pot{transform:scale(.88) rotate(-5deg)}
.tag{font-size:13px;font-weight:700;color:var(--m)}
.bar{width:68%;height:9px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#7cf29a,#f6e65b)}
.r-g{border-color:#ffd24a;box-shadow:0 0 30px rgba(255,200,60,.35),inset 0 0 40px rgba(255,200,60,.12)}
.r-g .pot{filter:sepia(1) saturate(6) hue-rotate(-8deg) brightness(1.15) drop-shadow(0 0 18px #ffc83a)}.r-g .tag{color:#ffd24a}
.r-d{border-color:#6eeaff;box-shadow:0 0 34px rgba(90,230,255,.4),inset 0 0 40px rgba(90,230,255,.14)}
.r-d .pot{filter:sepia(1) saturate(4) hue-rotate(155deg) brightness(1.5) drop-shadow(0 0 20px #5ee7ff)}.r-d .tag{color:#7ff0ff}
.r-r{border-color:#fff;animation:rg 3s linear infinite}
.r-r .pot{animation:rb 3s linear infinite}.r-r .tag{color:#fff}
@keyframes rb{from{filter:sepia(1) saturate(8) hue-rotate(0) drop-shadow(0 0 22px #fff)}to{filter:sepia(1) saturate(8) hue-rotate(360deg) drop-shadow(0 0 22px #fff)}}
@keyframes rg{from{box-shadow:0 0 36px #ff4d6d,inset 0 0 40px rgba(255,77,109,.2)}33%{box-shadow:0 0 36px #ffe14d,inset 0 0 40px rgba(255,225,77,.2)}66%{box-shadow:0 0 36px #4dd5ff,inset 0 0 40px rgba(77,213,255,.2)}to{box-shadow:0 0 36px #ff4d6d,inset 0 0 40px rgba(255,77,109,.2)}}
#combo{margin-top:10px;border-radius:16px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
#combo .bar{flex:1;width:auto}#combo .bar i{background:linear-gradient(90deg,#ff9f43,#ff4d6d)}
.card{border-radius:22px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04));border:1px solid var(--line)}
.card .tx{flex:1;min-width:0}.card .tx b{font-size:15px}.card .tx div{font-size:12px;color:var(--m);margin-top:2px}
.btn{border:1px solid var(--line);color:#fff;font-weight:700;font-size:14px;padding:10px 14px;border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px rgba(0,0,0,.25);min-width:92px;transition:transform .08s}
.btn:active{transform:scale(.94)}.btn.ok{background:linear-gradient(145deg,rgba(124,242,154,.5),rgba(40,180,120,.3))}.btn:disabled{opacity:.45}
h3{margin:12px 2px 8px;font-size:15px;color:var(--m);font-weight:600}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{flex-direction:column;align-items:flex-start;gap:2px;margin:0}.stat b{font-size:20px}.stat small{color:var(--m)}
nav{display:flex;gap:8px;margin:0 14px 10px;padding:7px;border-radius:24px}
nav button{flex:1;border:0;background:none;color:var(--m);font-size:12px;font-weight:600;padding:8px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.fl{position:fixed;pointer-events:none;font-weight:800;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:up .8s ease-out forwards;z-index:9}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.sp{position:fixed;pointer-events:none;font-size:20px;z-index:9;animation:sp .9s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translate(-50%,-30px);opacity:0;border-radius:18px;padding:10px 16px;font-weight:700;font-size:14px;transition:.3s;z-index:20;text-align:center;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.r-r,.r-r .pot{animation:none}}
</style></head><body>
<header>
 <div class="pill glass"><small>Монеты</small><b id="coins">0</b></div>
 <div class="pill glass"><small>Авто, в сек</small><b id="dps">0</b></div>
</header>
<main>
 <section class="view on" id="v0"><div id="slots"></div>
  <div id="combo" class="glass"><span id="cl">Комбо ×1.0</span><div class="bar"><i id="cb"></i></div></div></section>
 <section class="view" id="v1"></section>
 <section class="view" id="v2"></section>
</main>
<nav class="glass">
 <button class="on" data-v="0"><span>🥔</span>Чистка</button>
 <button data-v="1"><span>🛠️</span>Улучшения</button>
 <button data-v="2"><span>🏡</span>Ферма</button>
</nav>
<div id="toast" class="glass"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#1b1440');tg.setBackgroundColor('#120d2b')}catch(e){}}
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const $=id=>document.getElementById(id);
const R={n:{t:'Обычная',m:1,h:1,e:''},g:{t:'Золотая',m:4,h:1.5,e:'⭐'},d:{t:'Алмазная',m:20,h:2,e:'💎'},r:{t:'Радужная',m:100,h:3,e:'🌈'}};
const U={
 power:{n:'Острый нож',i:'🔪',b:12,g:1.45,max:99,d:l=>`Урон за тап: ${pw(l).toFixed(1)} → ${pw(l+1).toFixed(1)}`},
 value:{n:'Цена картошки',i:'💰',b:50,g:1.5,max:99,d:l=>`Монет за обычную: ${vl(l)} → ${vl(l+1)}`},
 slots:{n:'Большая корзина',i:'🧺',b:150,g:2.4,max:5,d:l=>`Картошек за раз: ${1+l} → ${2+l}`},
 helper:{n:'Помощник',i:'🧑‍🍳',b:80,g:1.5,max:99,d:l=>`Автоурон: ${l*2} → ${l*2+2} в сек`},
 machine:{n:'Чистильная машина',i:'⚙️',b:1500,g:1.6,max:99,d:l=>`Автоурон: +${l*10} → +${l*10+10} в сек`},
 luck:{n:'Нюх на удачу',i:'🍀',b:200,g:1.55,max:25,d:l=>`Шанс редкой: ×${(1+l*.12).toFixed(2)} → ×${(1+(l+1)*.12).toFixed(2)}`}
};
const pw=l=>1+l*1.2,vl=l=>Math.round(2*(1+l*.4));
const fresh=()=>({coins:0,total:0,peeled:0,prest:0,lv:{power:0,value:0,slots:0,helper:0,machine:0,luck:0},found:{g:0,d:0,r:0},t:Date.now()});
let S=fresh();
try{const j=localStorage.getItem('pt');if(j)S=Object.assign(fresh(),JSON.parse(j))}catch(e){}
const cm=()=>1+S.prest*.5,dpsOf=()=>S.lv.helper*2+S.lv.machine*10,luck=()=>1+S.lv.luck*.12;
const cost=k=>Math.floor(U[k].b*Math.pow(U[k].g,S.lv[k]));
const f=n=>{n=Math.floor(n);const u=['','K','M','B','T','Qa'];let i=0;while(n>=1000&&i<5){n/=1000;i++}return(i?n.toFixed(n<10?2:1):n)+u[i]};
let P=[],combo=0,last=0,tab=0;
function roll(){const x=Math.random(),l=luck();let r='n';if(x<.002*l)r='r';else if(x<.017*l)r='d';else if(x<.097*l)r='g';const mx=12*R[r].h;return{r,hp:mx,mx}}
function fit(){const n=1+S.lv.slots;while(P.length<n)P.push(roll());P.length=n;draw()}
function draw(){const s=$('slots');s.style.gridTemplateColumns=P.length==1?'1fr':'1fr 1fr';
 s.innerHTML=P.map((p,i)=>`<div class="slot glass r-${p.r}" data-i="${i}"><div class="pot">🥔</div><div class="tag">${p.r=='n'?'Картошка':R[p.r].e+' '+R[p.r].t+' ×'+R[p.r].m}</div><div class="bar"><i></i></div></div>`).join('');
 P.forEach((p,i)=>bar(i))}
function bar(i){const e=$('slots').children[i];if(e)e.querySelector('i').style.width=(100-100*P[i].hp/P[i].mx)+'%'}
function pop(x,y,txt,col){const d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.cssText=`left:${x-20}px;top:${y-20}px;color:${col||'#fff'}`;document.body.appendChild(d);setTimeout(()=>d.remove(),800)}
function sparks(x,y,e){for(let i=0;i<10;i++){const d=document.createElement('div');d.className='sp';d.textContent=e;const a=Math.random()*6.28,r=50+Math.random()*70;d.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function hit(i,dmg,x,y){const p=P[i];if(!p)return;p.hp-=dmg;bar(i);if(p.hp>0)return;
 const mult=1+Math.min(combo,50)*.02,gain=Math.round(vl(S.lv.value)*R[p.r].m*cm()*mult);
 S.coins+=gain;S.total+=gain;S.peeled++;
 const el=$('slots').children[i],b=el?el.getBoundingClientRect():{left:0,top:0,width:0,height:0};
 x=x||b.left+b.width/2;y=y||b.top+b.height/2;
 const col={n:'#fff',g:'#ffd24a',d:'#7ff0ff',r:'#ff9de2'}[p.r];pop(x,y,'+'+f(gain),col);
 if(p.r!='n'){S.found[p.r]++;sparks(x,y,R[p.r].e);toast(`${R[p.r].e} ${R[p.r].t} картошка! +${f(gain)}`);hap('heavy')}
 P[i]=roll();draw();ui()}
function tap(i,e){const now=Date.now();combo=now-last<1200?combo+1:1;last=now;hit(i,pw(S.lv.power),e.clientX,e.clientY);hap('light')}
$('slots').addEventListener('pointerdown',e=>{const s=e.target.closest('.slot');if(s)tap(+s.dataset.i,e)});
setInterval(()=>{const d=dpsOf();if(d&&P.length)hit(Math.floor(Math.random()*P.length),d/10);
 if(Date.now()-last>1200)combo=0;
 const m=1+Math.min(combo,50)*.02;$('cl').textContent='Комбо ×'+m.toFixed(2);$('cb').style.width=Math.min(combo,50)*2+'%'},100);
function ui(){$('coins').textContent=f(S.coins);$('dps').textContent=f(dpsOf())}
function shop(){let h='<h3>Инструменты</h3>';
 for(const k of ['power','value','slots']) h+=card(k);
 h+='<h3>Автоматизация</h3>';for(const k of ['helper','machine']) h+=card(k);
 h+='<h3>Удача</h3>'+card('luck');$('v1').innerHTML=h}
function card(k){const u=U[k],l=S.lv[k],mx=l>=u.max,c=cost(k);
 return`<div class="card glass"><div class="ico">${u.i}</div><div class="tx"><b>${u.n} · ур. ${l}</b><div>${u.d(l)}</div></div><button class="btn ${S.coins>=c&&!mx?'ok':''}" data-k="${k}" ${mx||S.coins<c?'disabled':''}>${mx?'Макс.':'🪙 '+f(c)}</button></div>`}
$('v1').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,c=cost(k);
 if(S.coins>=c&&S.lv[k]<U[k].max){S.coins-=c;S.lv[k]++;hap('medium');if(k=='slots')fit();ui();shop()}});
const need=()=>20000*Math.pow(3,S.prest);
function farm(){const ok=S.total>=need();
 $('v2').innerHTML=`<h3>Статистика</h3><div class="stat">
 <div class="card glass"><small>Очищено</small><b>${f(S.peeled)}</b></div>
 <div class="card glass"><small>Заработано</small><b>🪙 ${f(S.total)}</b></div>
 <div class="card glass"><small>⭐ Золотых</small><b>${S.found.g}</b></div>
 <div class="card glass"><small>💎 Алмазных</small><b>${S.found.d}</b></div>
 <div class="card glass" style="grid-column:span 2"><small>🌈 Радужных</small><b>${S.found.r}</b></div></div>
 <h3>Новая ферма</h3><div class="card glass"><div class="ico">🏡</div><div class="tx"><b>Уровень фермы ${S.prest}</b><div>Сброс прокачки и монет. Навсегда +50% к доходу (сейчас ×${cm().toFixed(1)}). Нужно заработать 🪙 ${f(need())} за всё время.</div></div></div>
 <button class="btn ${ok?'ok':''}" id="pr" style="width:100%;padding:14px" ${ok?'':'disabled'}>${ok?'Открыть новую ферму':'Ещё не хватает монет'}</button>`}
$('v2').addEventListener('click',e=>{if(e.target.id=='pr'&&S.total>=need()){const p=S.prest+1,fd=S.found,t=S.total,pe=S.peeled;S=fresh();S.prest=p;S.found=fd;S.total=t;S.peeled=pe;P=[];fit();ui();farm();toast('🏡 Ферма уровня '+p+'! Доход ×'+cm().toFixed(1))}});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=+b.dataset.v;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
 document.querySelectorAll('.view').forEach((v,i)=>v.classList.toggle('on',i==tab));if(tab==1)shop();if(tab==2)farm();hap('light')});
setInterval(()=>{ui();if(tab==1)shop()},700);
function save(){S.t=Date.now();const j=JSON.stringify(S);try{localStorage.setItem('pt',j)}catch(e){}try{tg.CloudStorage.setItem('pt',j)}catch(e){}}
setInterval(save,4000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>document.hidden&&save());
function offline(){const sec=Math.min((Date.now()-S.t)/1000,7200),d=dpsOf();if(d>0&&sec>30){const n=d*sec/12,g=Math.round(n*vl(S.lv.value)*cm()*.5);S.coins+=g;S.total+=g;toast(`😴 Пока тебя не было: +${f(g)} 🪙`)}}
offline();fit();ui();
try{tg.CloudStorage.getItem('pt',(er,v)=>{try{const c=JSON.parse(v);if(c&&c.t>S.t){S=Object.assign(fresh(),c);fit();ui()}}catch(e){}})}catch(e){}
</script></body></html>
